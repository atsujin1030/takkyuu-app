<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TableTennis Control</title>

<style>

/* =========================================================
   基本設定
========================================================= */

:root{
  --navy:#0f172a;
  --navy2:#172033;
  --blue:#2563eb;
  --blue-light:#dbeafe;
  --green:#16a34a;
  --green-light:#dcfce7;
  --red:#dc2626;
  --red-light:#fee2e2;
  --orange:#f59e0b;
  --orange-light:#fef3c7;
  --gray:#64748b;
  --gray-light:#f1f5f9;
  --line:#dbe2ea;
  --white:#ffffff;
  --bg:#f5f7fb;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
  background:var(--bg);
  color:#172033;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}


/* =========================================================
   HEADER
========================================================= */

header{
  height:72px;
  background:var(--navy);
  color:white;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 22px;

  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;

  font-weight:800;
  font-size:20px;
}

.logo{
  width:42px;
  height:42px;

  border-radius:12px;

  background:#2563eb;

  display:grid;
  place-items:center;

  font-size:22px;
}

.header-actions{
  display:flex;
  gap:10px;
}


/* =========================================================
   BUTTON
========================================================= */

.btn{
  border:0;
  border-radius:11px;

  padding:11px 16px;

  font-weight:700;

  transition:.15s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--blue);
  color:white;
}

.btn-light{
  background:white;
  color:#172033;
}

.btn-outline{
  background:white;
  color:#172033;
  border:2px solid #1f2937;
}

.btn-danger{
  background:var(--red-light);
  color:#991b1b;
}

.btn-small{
  padding:8px 11px;
  font-size:14px;
}


/* =========================================================
   LAYOUT
========================================================= */

.layout{
  display:flex;
  min-height:calc(100vh - 72px);
}

.sidebar{
  width:260px;

  background:white;

  border-right:1px solid var(--line);

  padding:22px 12px;

  flex-shrink:0;
}

.nav{
  display:grid;
  gap:7px;
}

.nav button{
  border:0;
  background:transparent;

  text-align:left;

  padding:14px 16px;

  border-radius:14px;

  font-weight:700;
  color:#334155;

  font-size:16px;
}

.nav button:hover{
  background:#f1f5f9;
}

.nav button.active{
  background:#e8f0ff;
  color:#1557d6;
}

.main{
  flex:1;

  padding:34px;

  width:100%;
  max-width:1700px;

  margin:auto;
}


/* =========================================================
   PAGE
========================================================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

.page-head{
  display:flex;

  justify-content:space-between;
  align-items:flex-end;

  gap:20px;

  margin-bottom:24px;
}

h1{
  font-size:30px;
  margin:0 0 4px;
}

.sub{
  color:#64748b;
  margin:0;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}


/* =========================================================
   CARD
========================================================= */

.card{
  background:white;

  border:1px solid var(--line);

  border-radius:20px;

  box-shadow:
    0 8px 25px rgba(15,23,42,.05);

  padding:22px;
}

.section-title{
  font-size:20px;
  font-weight:800;

  margin:0 0 15px;
}


/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:16px;

  margin-bottom:22px;
}

.stat-label{
  color:#64748b;
  font-size:14px;
}

.stat-value{
  font-size:34px;
  font-weight:800;

  margin-top:6px;
}


/* =========================================================
   DASHBOARD LAYOUT
========================================================= */

.dashboard-grid{
  display:grid;

  grid-template-columns:
    minmax(0,1.5fr)
    minmax(320px,.8fr);

  gap:20px;
}


/* =========================================================
   VENUE MAP
========================================================= */

.venue-card{
  min-width:0;
}

.venue-header{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;

  margin-bottom:15px;
}

.venue-title{
  font-size:21px;
  font-weight:800;
}

.venue-sub{
  color:#64748b;
  font-size:13px;
}


/*
  体育館を上から見たイメージ
*/

.venue{
  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.7) 1px,
      transparent 1px
    ),
    linear-gradient(
      rgba(255,255,255,.7) 1px,
      transparent 1px
    ),
    #dbe7d5;

  background-size:30px 30px;

  border-radius:18px;

  border:8px solid #cbd5c0;

  padding:18px;

  min-height:400px;

  position:relative;

  overflow:auto;
}

.venue-label{
  text-align:center;

  font-size:12px;
  font-weight:800;

  color:#64748b;

  margin-bottom:14px;
}

.court-map{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(180px,1fr)
    );

  gap:14px;
}


/*
  コートそのもの
*/

.map-court{
  position:relative;

  min-height:125px;

  background:#e5e7eb;

  border:3px solid #94a3b8;

  border-radius:8px;

  padding:10px;

  transition:.15s;

  cursor:pointer;
}

.map-court:hover{
  transform:translateY(-2px);

  box-shadow:
    0 8px 18px
    rgba(15,23,42,.18);
}


/* 空きコート */

.map-court.empty{
  background:#e5e7eb;

  border-color:#94a3b8;
}


/* 試合中 */

.map-court.live{
  background:#bbf7d0;

  border-color:#16a34a;

  box-shadow:
    0 0 0 3px
    rgba(22,163,74,.12);
}


/* 準備中 */

.map-court.prep{
  background:#dbeafe;

  border-color:#2563eb;
}


/* コート番号 */

.court-number{
  position:absolute;

  top:6px;
  left:8px;

  font-size:12px;

  font-weight:900;

  color:#475569;
}


/* 状態 */

.court-status{
  position:absolute;

  top:6px;
  right:7px;

  font-size:11px;

  font-weight:900;
}

.map-court.live
.court-status{
  color:#166534;
}

.map-court.empty
.court-status{
  color:#64748b;
}

.map-court.prep
.court-status{
  color:#1d4ed8;
}


/* 試合情報 */

.court-match{
  height:100%;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  padding-top:10px;

  text-align:center;
}

.court-player{
  font-weight:900;

  font-size:16px;

  line-height:1.35;

  max-width:100%;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.court-vs{
  font-size:11px;

  color:#64748b;

  margin:3px 0;
}

.court-round{
  font-size:10px;

  color:#64748b;

  margin-top:5px;
}


/* 空き */

.court-empty-text{
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#64748b;

  font-weight:700;
}


/* =========================================================
   NEXT MATCH
========================================================= */

.next-list{
  display:grid;
  gap:10px;
}

.next-item{
  border:1px solid #dbeafe;

  background:#eff6ff;

  border-radius:13px;

  padding:13px;
}

.next-item.first{
  border:2px solid #2563eb;

  background:#dbeafe;
}

.next-item strong{
  display:block;
}

.muted{
  color:#64748b;
}


/* =========================================================
   TABLE
========================================================= */

.table-wrap{
  overflow:auto;

  border:1px solid var(--line);

  border-radius:15px;
}

table{
  width:100%;

  border-collapse:collapse;

  background:white;
}

th,
td{
  padding:12px;

  border-bottom:1px solid var(--line);

  text-align:left;

  white-space:nowrap;
}

th{
  background:#f8fafc;

  font-size:13px;

  color:#64748b;
}


/* =========================================================
   FORM
========================================================= */

.form-grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:14px;
}

.field{
  display:grid;

  gap:6px;
}

.field label{
  font-weight:700;

  font-size:14px;
}

.field input,
.field select{
  border:1px solid #cbd5e1;

  border-radius:10px;

  padding:11px 12px;

  background:white;

  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:#2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);
}

.full{
  grid-column:1/-1;
}

.player-add{
  display:flex;

  gap:10px;

  align-items:end;
}

.player-add .field{
  flex:1;
}

.player-list{
  display:grid;

  gap:8px;

  margin-top:16px;
}

.player-row{
  display:flex;

  justify-content:space-between;

  align-items:center;

  border:1px solid var(--line);

  padding:11px 13px;

  border-radius:11px;

  background:white;
}


/* =========================================================
   TOURNAMENT BRACKET
========================================================= */

.tournament-scroll{
  overflow-x:auto;

  padding-bottom:15px;
}

.tournament{
  display:flex;

  align-items:flex-start;

  gap:28px;

  min-width:max-content;
}

.round{
  width:240px;

  display:flex;

  flex-direction:column;

  gap:18px;
}

.round-title{
  font-weight:900;

  color:#475569;

  text-align:center;

  margin-bottom:2px;
}


/*
  試合カード
*/

.bracket-match{
  background:white;

  border:1px solid var(--line);

  border-radius:14px;

  overflow:hidden;

  box-shadow:
    0 4px 12px
    rgba(0,0,0,.04);

  position:relative;
}

.bracket-match.live{
  border:2px solid #22c55e;
}

.bracket-match.done{
  border-color:#cbd5e1;
}


/*
  選手
*/

.bracket-player{
  padding:12px 13px;

  font-weight:700;

  border-bottom:1px solid #e2e8f0;

  min-height:45px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:8px;
}


/*
  勝ち上がった選手
  ★ 赤色
*/

.bracket-player.winner{
  color:#dc2626;

  background:#fff1f2;

  font-weight:900;

  border-left:5px solid #dc2626;
}

.winner-mark{
  font-size:12px;

  font-weight:900;

  color:#dc2626;
}


/*
  スコア
*/

.bracket-score{
  color:#64748b;

  font-size:13px;

  font-weight:800;
}


/*
  状態
*/

.bracket-status{
  padding:7px 12px;

  font-size:11px;

  color:#64748b;

  background:#f8fafc;
}


/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
  position:fixed;

  inset:0;

  background:
    rgba(15,23,42,.55);

  display:none;

  align-items:center;
  justify-content:center;

  padding:18px;

  z-index:200;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:min(580px,100%);

  background:white;

  border-radius:20px;

  padding:24px;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.25);

  max-height:90vh;

  overflow:auto;
}

.modal h2{
  margin-top:0;
}

.modal-actions{
  display:flex;

  justify-content:flex-end;

  gap:9px;

  margin-top:20px;
}

.choice-grid{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin:14px 0;
}

.choice{
  border:2px solid #dbe2ea;

  background:white;

  border-radius:13px;

  padding:15px;

  text-align:left;

  font-weight:800;

  cursor:pointer;
}

.choice:hover{
  background:#f8fafc;
}

.choice.selected{
  border-color:#2563eb;

  background:#eff6ff;

  color:#1d4ed8;
}


/* =========================================================
   COURT DETAIL
========================================================= */

.court-detail{
  background:#f8fafc;

  border-radius:14px;

  padding:15px;

  margin-bottom:15px;
}

.detail-court-number{
  font-size:13px;

  color:#64748b;

  font-weight:800;

  margin-bottom:6px;
}

.detail-players{
  font-size:22px;

  font-weight:900;

  text-align:center;

  padding:12px 0;
}

.detail-vs{
  color:#64748b;

  font-size:13px;

  text-align:center;

  margin:2px;
}


/* =========================================================
   NOTICE
========================================================= */

.notice{
  padding:12px 14px;

  border-radius:11px;

  background:#eff6ff;

  color:#1d4ed8;

  margin-bottom:14px;
}

.empty{
  padding:28px;

  text-align:center;

  color:#64748b;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;

  right:18px;
  bottom:18px;

  background:#172033;

  color:white;

  padding:13px 17px;

  border-radius:12px;

  display:none;

  z-index:300;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.2);
}

.toast.show{
  display:block;
}


/* =========================================================
   SPECTATOR MODE
========================================================= */

.spectator .operator-only{
  display:none!important;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

  .sidebar{
    width:82px;

    padding:12px 8px;
  }

  .nav button{
    font-size:0;

    text-align:center;
  }

  .nav button::first-letter{
    font-size:22px;
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

}


@media(max-width:700px){

  header{
    height:64px;

    padding:0 12px;
  }

  .brand{
    font-size:16px;
  }

  .logo{
    width:36px;
    height:36px;
  }

  .header-actions .btn{
    padding:8px 10px;

    font-size:12px;
  }

  .sidebar{
    display:none;
  }

  .layout{
    min-height:
      calc(100vh - 64px);
  }

  .main{
    padding:18px 12px;
  }

  h1{
    font-size:25px;
  }

  .page-head{
    align-items:flex-start;

    flex-direction:column;
  }

  .stats{
    gap:9px;
  }

  .card{
    padding:15px;

    border-radius:15px;
  }

  .stat-value{
    font-size:28px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .player-add{
    align-items:stretch;

    flex-direction:column;
  }

  .court-map{
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );

    gap:8px;
  }

  .map-court{
    min-height:115px;
  }

  .court-player{
    font-size:13px;
  }

  .choice-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>


<body>


<div class="app">


<!-- =========================================================
     HEADER
========================================================= -->

<header>

  <div class="brand">

    <div class="logo">
      🏓
    </div>

    TableTennis Control

  </div>


  <div class="header-actions">

    <button
      class="btn btn-light"
      id="modeBtn">

      📺 選手・観客モード

    </button>


    <button
      class="btn btn-light operator-only"
      id="backupBtn">

      バックアップ

    </button>

  </div>

</header>



<div class="layout">


<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside class="sidebar operator-only">

  <nav class="nav">

    <button
      class="active"
      data-page="dashboard">

      📊 進行ダッシュボード

    </button>


    <button data-page="matches">

      🏓 試合管理

    </button>


    <button data-page="tournament">

      🏆 トーナメント

    </button>


    <button data-page="players">

      👥 選手登録

    </button>


    <button data-page="settings">

      ⚙️ 大会設定

    </button>

  </nav>

</aside>



<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">


<!-- =========================================================
     DASHBOARD
========================================================= -->

<section
  class="page active"
  id="page-dashboard">


  <div class="page-head">

    <div>

      <h1>
        進行ダッシュボード
      </h1>

      <p
        class="sub"
        id="eventSubtitle">

        大会を設定してください

      </p>

    </div>


    <div class="actions operator-only">

      <button
        class="btn btn-primary"
        id="assignBtn">

        📣 次の試合をコートへ

      </button>


      <button
        class="btn btn-outline"
        id="quickResultBtn">

        結果入力

      </button>

    </div>

  </div>



  <!-- STATS -->

  <div class="stats">


    <div class="card">

      <div class="stat-label">
        試合中
      </div>

      <div
        class="stat-value"
        id="statLive">

        0

      </div>

    </div>


    <div class="card">

      <div class="stat-label">
        待機中
      </div>

      <div
        class="stat-value"
        id="statWaiting">

        0

      </div>

    </div>


    <div class="card">

      <div class="stat-label">
        終了試合
      </div>

      <div
        class="stat-value"
        id="statDone">

        0

      </div>

    </div>


    <div class="card">

      <div class="stat-label">
        空きコート
      </div>

      <div
        class="stat-value"
        id="statEmpty">

        0

      </div>

    </div>

  </div>



  <!-- DASHBOARD -->

  <div class="dashboard-grid">


    <!-- VENUE -->

    <div class="card venue-card">


      <div class="venue-header">

        <div>

          <div class="venue-title">
            🏟️ 会場全体
          </div>

          <div class="venue-sub">

            コートをクリックすると
            試合結果を入力できます

          </div>

        </div>

      </div>


      <div class="venue">


        <div class="venue-label">

          ―――――――　体育館・会場　―――――――

        </div>


        <div
          class="court-map"
          id="courtGrid">

        </div>


      </div>


    </div>



    <!-- NEXT -->

    <div class="card">


      <h2 class="section-title">

        📣 次に呼ぶ試合

      </h2>


      <div
        id="nextMatches"
        class="next-list">

      </div>


    </div>


  </div>


</section>



<!-- =========================================================
     MATCH MANAGEMENT
========================================================= -->

<section
  class="page"
  id="page-matches">


  <div class="page-head">

    <div>

      <h1>
        試合管理
      </h1>

      <p class="sub">

        試合を選択して
        コート割当・結果入力を行います。

      </p>

    </div>

  </div>


  <div class="card">

    <div id="matchTable">

    </div>

  </div>


</section>



<!-- =========================================================
     TOURNAMENT
========================================================= -->

<section
  class="page"
  id="page-tournament">


  <div class="page-head">

    <div>

      <h1>
        トーナメント
      </h1>

      <p class="sub">

        勝者は赤色で表示され、
        次戦へ進んだことが分かります。

      </p>

    </div>


    <div class="actions operator-only">

      <button
        class="btn btn-primary"
        id="generateBtn">

        トーナメント生成

      </button>

    </div>

  </div>


  <div class="card">

    <div
      class="tournament-scroll"
      id="bracket">

    </div>

  </div>


</section>



<!-- =========================================================
     PLAYERS
========================================================= -->

<section
  class="page"
  id="page-players">


  <div class="page-head">

    <div>

      <h1>
        選手登録
      </h1>

      <p class="sub">

        Enterキーで連続して登録できます。

      </p>

    </div>

  </div>



  <div class="card">


    <div class="player-add">


      <div class="field">

        <label>
          選手名
        </label>

        <input
          id="playerName"
          placeholder="例：田中 太郎"
          autocomplete="off">

<!-- =========================================================
     MODAL
========================================================= -->

<div
  class="modal-backdrop"
  id="modalBackdrop">


  <div
    class="modal"
    id="modal">

  </div>


</div>



<div
  class="toast"
  id="toast">

</div>



<script>

(function(){

"use strict";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
  "tabletennis-control-v3";


const defaultState = {

  settings:{
    eventName:"",
    courtCount:4
  },

  players:[],

  matches:[],

  courts:[],

  generated:false

};


let state =
  loadState();


let spectator =
  false;


/* =========================================================
   MULTI TAB SYNC
========================================================= */

let channel = null;

try{

  channel =
    new BroadcastChannel(
      "tabletennis-control-sync-v3"
    );

}catch(e){

  channel = null;

}


/* =========================================================
   LOAD / SAVE
========================================================= */

function clone(obj){

  return JSON.parse(
    JSON.stringify(obj)
  );

}


function loadState(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!raw){

      return clone(
        defaultState
      );

    }


    const parsed =
      JSON.parse(raw);


    return Object.assign(
      clone(defaultState),
      parsed
    );


  }catch(e){

    return clone(
      defaultState
    );

  }

}


function saveState(
  broadcast=true
){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );


  if(
    broadcast &&
    channel
  ){

    channel.postMessage({

      type:"state",

      state:state

    });

  }


  renderAll();

}


if(channel){

  channel.onmessage =
    function(event){

      if(
        event.data &&
        event.data.type === "state"
      ){

        state =
          event.data.state;

        renderAll();

      }

    };

}


window.addEventListener(
  "storage",
  function(event){

    if(
      event.key ===
      STORAGE_KEY &&
      event.newValue
    ){

      try{

        state =
          JSON.parse(
            event.newValue
          );

        renderAll();

      }catch(e){}

    }

  }
);


/* =========================================================
   UTILITIES
========================================================= */

function esc(value){

  return String(
    value == null
      ? ""
      : value
  ).replace(
    /[&<>"']/g,
    function(char){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[char];

    }
  );

}


function uid(prefix){

  return (
    prefix +
    "_" +
    Date.now().toString(36) +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8)
  );

}


function toast(message){

  const el =
    document.getElementById(
      "toast"
    );


  el.textContent =
    message;


  el.classList.add(
    "show"
  );


  clearTimeout(
    window.__toastTimer
  );


  window.__toastTimer =
    setTimeout(
      function(){

        el.classList.remove(
          "show"
        );

      },
      2300
    );

}


function playerLabel(id){

  if(!id){

    return "未定";

  }


  const player =
    state.players.find(
      p =>
        p.id === id
    );


  if(!player){

    return "未定";

  }


  return (
    player.name +
    (
      player.team
        ? "（" +
          player.team +
          "）"
        : ""
    )
  );

}


/* =========================================================
   COURTS
========================================================= */

function initCourts(){

  const count =
    Math.max(
      1,
      Math.min(
        40,
        Number(
          state.settings.courtCount
        ) || 4
      )
    );


  const oldCourts =
    Array.isArray(
      state.courts
    )
      ? state.courts
      : [];


  state.courts =
    Array.from(
      {
        length:count
      },
      function(_,index){

        return (
          oldCourts[index] ||
          {
            id:index+1,
            status:"empty",
            matchId:null
          }
        );

      }
    );

}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function go(page){

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      function(pageEl){

        pageEl.classList.remove(
          "active"
        );

      }
    );


  const target =
    document.getElementById(
      "page-" + page
    );


  if(target){

    target.classList.add(
      "active"
    );

  }


  document
    .querySelectorAll(
      ".nav button"
    )
    .forEach(
      function(button){

        button.classList.toggle(
          "active",
          button.dataset.page === page
        );

      }
    );

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(){

  document
    .getElementById(
      "modalBackdrop"
    )
    .classList.remove(
      "show"
    );

}


document
  .getElementById(
    "modalBackdrop"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target.id ===
        "modalBackdrop"
      ){

        closeModal();

      }

    }
  );


/* =========================================================
   PLAYER ADD
========================================================= */

function addPlayer(){

  const nameInput =
    document.getElementById(
      "playerName"
    );


  const teamInput =
    document.getElementById(
      "playerTeam"
    );


  const name =
    nameInput.value.trim();


  const team =
    teamInput.value.trim();


  if(!name){

    toast(
      "選手名を入力してください"
    );

    nameInput.focus();

    return;

  }


  state.players.push({

    id:uid("p"),

    name:name,

    team:team

  });


  nameInput.value = "";

  teamInput.value = "";


  saveState();


  toast(
    name +
    " を登録しました"
  );


  /*
    連続登録をしやすくするため
    選手名欄へ自動フォーカス
  */

  nameInput.focus();

}


/* =========================================================
   ENTERで選手追加
========================================================= */

document
  .getElementById(
    "playerName"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        addPlayer();

      }

    }
  );


document
  .getElementById(
    "playerTeam"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        addPlayer();

      }

    }
  );


/* =========================================================
   REMOVE PLAYER
========================================================= */

function removePlayer(id){

  const used =
    state.matches.some(
      function(match){

        return (
          match.player1 === id ||
          match.player2 === id
        );

      }
    );


  if(used){

    toast(
      "試合に登録済みの選手は削除できません"
    );

    return;

  }


  state.players =
    state.players.filter(
      function(player){

        return player.id !== id;

      }
    );


  saveState();

  toast(
    "選手を削除しました"
  );

}


/* =========================================================
   TOURNAMENT GENERATION
========================================================= */

function generateTournament(){

  if(
    state.players.length < 2
  ){

    toast(
      "2人以上の選手を登録してください"
    );

    return;

  }


  if(
    state.matches.length &&
    !confirm(
      "現在のトーナメントを削除して、新しく作成しますか？"
    )
  ){

    return;

  }


  let players =
    state.players.slice();


  /*
    2の累乗になるまで
    BYEを追加
  */

  const size =
    Math.pow(
      2,
      Math.ceil(
        Math.log2(
          players.length
        )
      )
    );


  while(
    players.length <
    size
  ){

    players.push(null);

  }


  state.matches = [];


  const roundCount =
    Math.log2(size);


  let previousIds = [];


  /*
    第1回戦
  */

  for(
    let i=0;
    i<size;
    i+=2
  ){

    const match = {

      id:uid("m"),

      round:1,

      number:
        i / 2 + 1,

      player1:
        players[i]
          ? players[i].id
          : null,

      player2:
        players[i+1]
          ? players[i+1].id
          : null,

      winner:null,

      score:"",

      status:"waiting",

      courtId:null,

      source1:null,

      source2:null

    };


    /*
      BYEなら自動勝ち上がり
    */

    if(
      match.player1 &&
      !match.player2
    ){

      match.winner =
        match.player1;

      match.status =
        "done";

    }


    if(
      !match.player1 &&
      match.player2
    ){

      match.winner =
        match.player2;

      match.status =
        "done";

    }


    state.matches.push(
      match
    );


    previousIds.push(
      match.id
    );

  }


  /*
    2回戦以降
  */

  for(
    let round=2;
    round<=roundCount;
    round++
  ){

    const matchesInRound =
      size /
      Math.pow(
        2,
        round
      );


    const currentIds = [];


    for(
      let n=0;
      n<matchesInRound;
      n++
    ){

      const match = {

        id:uid("m"),

        round:round,

        number:n+1,

        player1:null,

        player2:null,

        winner:null,

        score:"",

        status:"waiting",

        courtId:null,

        source1:
          previousIds[n*2],

        source2:
          previousIds[n*2+1]

      };


      state.matches.push(
        match
      );


      currentIds.push(
        match.id
      );

    }


    previousIds =
      currentIds;

  }


  /*
    BYEの結果を次戦へ伝える
  */

  state.matches.forEach(
    function(match){

      if(match.winner){

        propagateWinner(
          match
        );

      }

    }
  );


  state.generated =
    true;


  initCourts();


  autoAssign();


  saveState();


  toast(
    "トーナメントを作成しました"
  );


  go("tournament");

}


/* =========================================================
   GET MATCH
========================================================= */

function getMatch(id){

  return state.matches.find(
    function(match){

      return match.id === id;

    }
  );

}


/* =========================================================
   AVAILABLE MATCHES
========================================================= */

function availableMatches(){

  return state.matches.filter(
    function(match){

      return (
        match.status === "waiting" &&
        match.player1 &&
        match.player2 &&
        !match.courtId
      );

    }
  );

}


/* =========================================================
   PROPAGATE WINNER
========================================================= */

function propagateWinner(match){

  const nextMatches =
    state.matches.filter(
      function(next){

        return (
          next.source1 === match.id ||
          next.source2 === match.id
        );

      }
    );


  nextMatches.forEach(
    function(next){

      if(
        next.source1 ===
        match.id
      ){

        next.player1 =
          match.winner;

      }


      if(
        next.source2 ===
        match.id
      ){

        next.player2 =
          match.winner;

      }

    }
  );

}


/* =========================================================
   AUTO ASSIGN
========================================================= */

function autoAssign(){

  initCourts();


  const freeCourts =
    state.courts.filter(
      function(court){

        return (
          court.status ===
          "empty"
        );

      }
    );


  const matches =
    availableMatches();


  for(
    let i=0;
    i<matches.length;
    i++
  ){

    if(
      !freeCourts.length
    ){

      break;

    }


    const match =
      matches[i];


    const court =
      freeCourts.shift();


    match.courtId =
      court.id;

    match.status =
      "live";


    court.status =
      "live";

    court.matchId =
      match.id;

  }

}


/* =========================================================
   ASSIGN NEXT
========================================================= */

function assignNext(){

  autoAssign();

  saveState();


  toast(
    "次の試合を空きコートへ割り当てました"
  );

}


/* =========================================================
   COURT CLICK
========================================================= */

function openCourt(courtId){

  const court =
    state.courts.find(
      function(c){

        return c.id === courtId;

      }
    );


  if(!court){

    return;

  }


  const match =
    court.matchId
      ? getMatch(
          court.matchId
        )
      : null;


  if(!match){

    /*
      空きコート
    */

    document
      .getElementById(
        "modal"
      )
      .innerHTML = `

        <h2>
          コート ${court.id}
        </h2>

        <div class="court-detail">

          <div class="detail-court-number">
            現在の状態
          </div>

          <div
            class="detail-players">

            空きコート

          </div>

        </div>

        <div class="notice">

          待機中の試合をこのコートへ呼ぶことができます。

        </div>

        <div class="modal-actions">

          <button
            class="btn btn-outline"
            id="closeCourtModal">

            閉じる

          </button>

          <button
            class="btn btn-primary operator-only"
            id="assignFromCourt">

            次の試合を呼ぶ

          </button>

        </div>

      `;


    document
      .getElementById(
        "closeCourtModal"
      )
      .onclick =
      closeModal;


    const assignButton =
      document.getElementById(
        "assignFromCourt"
      );


    if(assignButton){

      assignButton.onclick =
        function(){

          assignMatchToSpecificCourt(
            court.id
          );

        };

    }


    document
      .getElementById(
        "modalBackdrop"
      )
      .classList.add(
        "show"
      );


    return;

  }


  /*
    試合中
  */

  openResultModal(
    match.id,
    court.id
  );

}


/* =========================================================
   ASSIGN MATCH TO SPECIFIC COURT
========================================================= */

function assignMatchToSpecificCourt(
  courtId
){

  const court =
    state.courts.find(
      function(c){

        return c.id === courtId;

      }
    );


  if(!court){

    return;

  }


  if(
    court.status !==
    "empty"
  ){

    toast(
      "このコートは空いていません"
    );

    return;

  }


  const match =
    availableMatches()[0];


  if(!match){

    toast(
      "現在、呼べる試合がありません"
    );

    closeModal();

    return;

  }


  match.courtId =
    court.id;

  match.status =
    "live";


  court.status =
    "live";

  court.matchId =
    match.id;


  saveState();


  closeModal();


  toast(
    "コート " +
    court.id +
    " に試合を入れました"
  );

}


/* =========================================================
   RESULT MODAL
========================================================= */

function openResultModal(
  matchId,
  courtId
){

  const match =
    getMatch(
      matchId
    );


  if(!match){

    return;

  }


  const p1 =
    playerLabel(
      match.player1
    );


  const p2 =
    playerLabel(
      match.player2
    );


  document
    .getElementById(
      "modal"
    )
    .innerHTML = `

      <h2>
        🏓 試合結果入力
      </h2>


      <div class="court-detail">

        <div class="detail-court-number">

          コート ${courtId}
          ・第${match.round}回戦

        </div>


        <div class="detail-players">

          ${esc(p1)}

          <div class="detail-vs">
            VS
          </div>

          ${esc(p2)}

        </div>

      </div>


      <div class="notice">

        勝者を選択し、
        セットカウントを入力してください。

        <br>

        例：
        <strong>3-0</strong>　
        <strong>3-1</strong>　
        <strong>3-2</strong>

      </div>


      <div class="choice-grid">


        <button
          class="choice"
          data-winner="${esc(match.player1)}">

          ${esc(p1)}

        </button>


        <button
          class="choice"
          data-winner="${esc(match.player2)}">

          ${esc(p2)}

        </button>


      </div>


      <div class="field">

        <label>
          セットカウント
        </label>

        <input
          id="resultScore"
          placeholder="例：3-1"
          maxlength="3"
          autocomplete="off">

      </div>


      <div class="modal-actions">

        <button
          class="btn btn-outline"
          id="cancelResult">

          キャンセル

        </button>


        <button
          class="btn btn-primary"
          id="confirmResult">

          結果を確定

        </button>

      </div>

    `;


  let winner =
    null;


  document
    .querySelectorAll(
      ".choice"
    )
    .forEach(
      function(button){

        button.addEventListener(
          "click",
          function(){

            winner =
              button.dataset.winner;


            document
              .querySelectorAll(
                ".choice"
              )
              .forEach(
                function(other){

                  other.classList.remove(
                    "selected"
                  );

                }
              );


            button.classList.add(
              "selected"
            );

          }
        );

      }
    );


  document
    .getElementById(
      "cancelResult"
    )
    .onclick =
    closeModal;


  document
    .getElementById(
      "confirmResult"
    )
    .onclick =
    function(){

      if(!winner){

        toast(
          "勝者を選択してください"
        );

        return;

      }


      const score =
        document
          .getElementById(
            "resultScore"
          )
          .value
          .trim();


      if(
        !/^[0-9]+-[0-9]+$/.test(
          score
        )
      ){

        toast(
          "セットカウントを 3-1 のように入力してください"
        );

        return;

      }


      finishMatch(
        match.id,
        winner,
        score
      );

    };


  /*
    スコア欄でEnterを押しても確定
  */

  document
    .getElementById(
      "resultScore"
    )
    .addEventListener(
      "keydown",
      function(event){

        if(
          event.key ===
          "Enter"
        ){

          event.preventDefault();

          document
            .getElementById(
              "confirmResult"
            )
            .click();

        }

      }
    );


  document
    .getElementById(
      "modalBackdrop"
    )
    .classList.add(
      "show"
    );

}


/* =========================================================
   FINISH MATCH
========================================================= */

function finishMatch(
  matchId,
  winner,
  score
){

  const match =
    getMatch(
      matchId
    );


  if(!match){

    return;

  }


  match.winner =
    winner;

  match.score =
    score;

  match.status =
    "done";


  /*
    コートを空ける
  */

  if(
    match.courtId
  ){

    const court =
      state.courts.find(
        function(c){

          return (
            c.id ===
            match.courtId
          );

        }
      );


    if(court){

      court.status =
        "empty";

      court.matchId =
        null;

    }


    match.courtId =
      null;

  }


  /*
    勝者を次戦へ
  */

  propagateWinner(
    match
  );


  /*
    次の試合を自動割当
  */

  autoAssign();


  saveState();


  closeModal();


  toast(
    "結果を登録しました。勝者が次戦へ進みました。"
  );


  /*
    トーナメント画面を更新するため
    現在の表示も即更新
  */

  renderAll();

}


/* =========================================================
   RESET MATCH
========================================================= */

function resetMatch(id){

  const match =
    getMatch(id);


  if(!match){

    return;

  }


  if(
    !confirm(
      "この試合の結果をリセットしますか？"
    )
  ){

    return;

  }


  /*
    コートを解放
  */

  if(
    match.courtId
  ){

    const court =
      state.courts.find(
        function(c){

          return (
            c.id ===
            match.courtId
          );

        }
      );


    if(court){

      court.status =
        "empty";

      court.matchId =
        null;

    }

  }


  match.courtId =
    null;

  match.winner =
    null;

  match.score =
    "";

  match.status =
    "waiting";


  /*
    次戦から選手を取り消す
  */

  state.matches.forEach(
    function(next){

      if(
        next.source1 ===
        match.id
      ){

        next.player1 =
          null;

      }


      if(
        next.source2 ===
        match.id
      ){

        next.player2 =
          null;

      }


      /*
        次戦以降もリセット
      */

      if(
        next.round >
        match.round
      ){

        /*
          winnerがこの選手の場合だけ
          安全にクリア
        */

        if(
          next.winner
        ){

          next.winner =
            null;

          next.score =
            "";

          next.status =
            "waiting";

        }

      }

    }
  );


  autoAssign();


  saveState();


  toast(
    "結果をリセットしました"
  );

}


/* =========================================================
   RENDER DASHBOARD
========================================================= */

function renderDashboard(){

  initCourts();


  const live =
    state.matches.filter(
      function(match){

        return (
          match.status ===
          "live"
        );

      }
    ).length;


  const waiting =
    availableMatches()
      .length;


  const done =
    state.matches.filter(
      function(match){

        return (
          match.status ===
          "done"
        );

      }
    ).length;


  const empty =
    state.courts.filter(
      function(court){

        return (
          court.status ===
          "empty"
        );

      }
    ).length;


  document
    .getElementById(
      "statLive"
    )
    .textContent =
    live;


  document
    .getElementById(
      "statWaiting"
    )
    .textContent =
    waiting;


  document
    .getElementById(
      "statDone"
    )
    .textContent =
    done;


  document
    .getElementById(
      "statEmpty"
    )
    .textContent =
    empty;


  document
    .getElementById(
      "eventSubtitle"
    )

/* =========================================================
   RENDER COURT MAP
========================================================= */

function renderCourtMap(){

  const grid =
    document.getElementById(
      "courtGrid"
    );


  if(
    !state.courts.length
  ){

    grid.innerHTML =
      `

        <div class="empty">

          コート数を設定してください。

        </div>

      `;

    return;

  }


  grid.innerHTML =
    state.courts
      .map(
        function(court){

          const match =
            court.matchId
              ? getMatch(
                  court.matchId
                )
              : null;


          if(match){

            return `

              <div
                class="map-court live"
                onclick="window.openCourt(${court.id})"
                title="クリックして結果入力">

                <div class="court-number">

                  コート ${court.id}

                </div>


                <div class="court-status">

                  ● 試合中

                </div>


                <div class="court-match">

                  <div
                    class="court-player">

                    ${esc(
                      playerLabel(
                        match.player1
                      )
                    )}

                  </div>


                  <div class="court-vs">

                    VS

                  </div>


                  <div
                    class="court-player">

                    ${esc(
                      playerLabel(
                        match.player2
                      )
                    )}

                  </div>


                  <div class="court-round">

                    第${match.round}回戦

                  </div>

                </div>

              </div>

            `;

          }


          return `

            <div
              class="map-court empty"
              onclick="window.openCourt(${court.id})"
              title="クリックして次の試合を呼ぶ">

              <div class="court-number">

                コート ${court.id}

              </div>


              <div class="court-status">

                空き

              </div>


              <div class="court-empty-text">

                空きコート

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   NEXT MATCHES
========================================================= */

function renderNextMatches(){

  const el =
    document.getElementById(
      "nextMatches"
    );


  const matches =
    availableMatches();


  if(!matches.length){

    el.innerHTML =
      `

        <div class="empty">

          現在、両選手が確定している
          待機試合はありません。

        </div>

      `;

    return;

  }


  el.innerHTML =
    matches
      .slice(0,10)
      .map(
        function(match,index){

          return `

            <div
              class="next-item ${
                index === 0
                  ? "first"
                  : ""
              }">


              <strong>

                ${
                  index === 0
                    ? "📣 "
                    : ""
                }

                第${match.round}回戦

              </strong>


              <div
                style="margin-top:5px">

                ${esc(
                  playerLabel(
                    match.player1
                  )
                )}

                <span class="muted">
                  VS
                </span>

                ${esc(
                  playerLabel(
                    match.player2
                  )
                )}

              </div>


              <div
                class="muted"
                style="margin-top:5px">

                ${
                  index === 0
                    ? "次に呼ぶ試合"
                    : "待機中"
                }

              </div>


              <button
                class="btn btn-primary btn-small operator-only"
                style="margin-top:8px"
                onclick="window.assignSpecific('${match.id}')">

                この試合を呼ぶ

              </button>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   ASSIGN SPECIFIC MATCH
========================================================= */

function assignSpecific(id){

  const match =
    getMatch(id);


  if(!match){

    return;

  }


  initCourts();


  const court =
    state.courts.find(
      function(c){

        return (
          c.status ===
          "empty"
        );

      }
    );


  if(!court){

    toast(
      "空きコートがありません"
    );

    return;

  }


  match.courtId =
    court.id;

  match.status =
    "live";


  court.status =
    "live";

  court.matchId =
    match.id;


  saveState();


  toast(
    "コート " +
    court.id +
    " に割り当てました"
  );

}

   RENDER PLAYERS
========================================================= */

/* =========================================================
   RENDER MATCH TABLE
========================================================= */

function renderMatches(){

  const el =
    document.getElementById(
      "matchTable"
    );


  if(
    !state.matches.length
  ){

    el.innerHTML =
      `

        <div class="empty">

          まだトーナメントが
          生成されていません。

        </div>

      `;

    return;

  }


  el.innerHTML =
    `

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>
                回戦
              </th>

              <th>
                対戦
              </th>

              <th>
                状態
              </th>

              <th>
                コート
              </th>

              <th>
                結果
              </th>

              <th>
                操作
              </th>

            </tr>

          </thead>


          <tbody>

            ${
              state.matches
                .map(
                  function(match){

                    const status =
                      match.status === "live"
                        ? "試合中"
                        : match.status === "done"
                          ? "終了"
                          : "待機";


                    return `

                      <tr>


                        <td>

                          第${match.round}回戦

                        </td>


                        <td>

                          <strong>

                            ${esc(
                              playerLabel(
                                match.player1
                              )
                            )}

                          </strong>


                          VS


                          <strong>

                            ${esc(
                              playerLabel(
                                match.player2
                              )
                            )}

                          </strong>

                        </td>


                        <td>

                          ${status}

                        </td>


                        <td>

                          ${
                            match.courtId
                              ? "コート " +
                                match.courtId
                              : "-"
                          }

                        </td>


                        <td>

                          ${
                            match.winner

                              ?

                                esc(
                                  playerLabel(
                                    match.winner
                                  )
                                ) +
                                " / " +
                                esc(
                                  match.score
                                )

                              :
                                "-"
                          }

                        </td>


                        <td>


                          ${
                            match.status ===
                            "live"

                              ?

                                `

                                  <button
                                    class="btn btn-primary btn-small operator-only"
                                    onclick="window.openResultModal('${match.id}',${match.courtId})">

                                    結果

                                  </button>

                                `

                              :

                              match.status === "waiting" &&
                              match.player1 &&
                              match.player2

                                ?

                                  `

                                    <button
                                      class="btn btn-outline btn-small operator-only"
                                      onclick="window.assignSpecific('${match.id}')">

                                      呼ぶ

                                    </button>

                                  `

                                :

                                  ""
                          }


                          ${
                            match.status ===
                            "done"

                              ?

                                `

                                  <button
                                    class="btn btn-danger btn-small operator-only"
                                    onclick="window.resetMatch('${match.id}')">

                                    リセット

                                  </button>

                                `

                              :
                                ""
                          }


                        </td>


                      </tr>

                    `;

                  }
                )
                .join("")
            }

          </tbody>

        </table>

      </div>

    `;

}


/* =========================================================
   RENDER TOURNAMENT
========================================================= */

function renderBracket(){

  const el =
    document.getElementById(
      "bracket"
    );


  if(
    !state.matches.length
  ){

    el.innerHTML =
      `

        <div class="empty">

          選手を登録して
          「トーナメント生成」
          を押してください。

        </div>

      `;

    return;

  }


  const maxRound =
    Math.max(
      ...state.matches.map(
        function(match){

          return match.round;

        }
      )
    );


  let html =
    '<div class="tournament">';


  for(
    let round=1;
    round<=maxRound;
    round++
  ){

    const matches =
      state.matches.filter(
        function(match){

          return (
            match.round ===
            round
          );

        }
      );


    html += `

      <div class="round">

        <div class="round-title">

          ${
            round === maxRound
              ? "🏆 決勝"
              : "第" +
                round +
                "回戦"
          }

        </div>

    `;


    matches.forEach(
      function(match){

        const player1Winner =
          match.winner ===
          match.player1;


        const player2Winner =
          match.winner ===
          match.player2;


        html += `

          <div
            class="bracket-match ${
              match.status === "live"
                ? "live"
                : match.status === "done"
                  ? "done"
                  : ""
            }">


            <div
              class="bracket-player ${
                player1Winner
                  ? "winner"
                  : ""
              }">


              <span>

                ${esc(
                  playerLabel(
                    match.player1
                  )
                )}

                ${
                  player1Winner
                    ? `

                      <span class="winner-mark">

                       　🏆 勝ち上がり

                      </span>

                    `
                    : ""
                }

              </span>


              ${
                player1Winner
                  ?

                    `<span class="bracket-score">
                      ${esc(
                        match.score
                      )}
                    </span>`

                  :
                    ""
              }


            </div>


            <div
              class="bracket-player ${
                player2Winner
                  ? "winner"
                  : ""
              }">


              <span>

                ${esc(
                  playerLabel(
                    match.player2
                  )
                )}

                ${
                  player2Winner
                    ? `

                      <span class="winner-mark">

                       　🏆 勝ち上がり

                      </span>

                    `
                    : ""
                }

              </span>


              ${
                !player1Winner &&
                player2Winner
                  ?

                    `<span class="bracket-score">
                      ${esc(
                        match.score
                      )}
                    </span>`

                  :
                    ""
              }


            </div>


            <div class="bracket-status">

              ${
                match.status === "live"

                  ? "🟢 試合中・コート " +
                    match.courtId

                  : match.status === "done"

                    ? "🔴 終了"

                    : (
                        match.player1 &&
                        match.player2
                      )
                        ? "📣 次の試合候補"
                        : "選手確定待ち"
              }

            </div>


          </div>

        `;

      }
    );


    html +=
      "</div>";

  }


  html +=
    "</div>";


  el.innerHTML =
    html;

}


/* =========================================================
   SETTINGS RENDER
========================================================= */

    .getElementById(
      "eventName"
    )

========================================================= */

function renderAll(){

  document.body
    .classList.toggle(
      "spectator",

    );

/* =========================================================
   SAVE SETTINGS
========================================================= */

document
  .getElementById(
    "saveSettingsBtn"
  )
  .addEventListener(
    "click",
    function(){

      const name =
        document
          .getElementById(
            "eventName"
          )
          .value
          .trim();


      const count =
        Number(
          document
            .getElementById(
              "courtCount"
            )
            .value
        );


      /*
        1〜40に制限
      */

      state.settings.eventName =
        name;


      state.settings.courtCount =
        Math.max(
          1,
          Math.min(
            40,
            count
          )
        );


      initCourts();


      saveState();


      toast(
        "大会設定を保存しました"
      );

    }
  );

   MODE
========================================================= */

  .getElementById(
    "modeBtn"
  )
  .addEventListener(
    "click",

      spectator =

      renderAll();

    }
  );


/* =========================================================
   BACKUP
========================================================= */

document
  .getElementById(
    "backupBtn"
  )
  .addEventListener(
    "click",
    exportData
  );


document
  .getElementById(
    "exportBtn"
  )
  .addEventListener(
    "click",
    exportData
  );


/* =========================================================
   EXPORT
========================================================= */

function exportData(){

  const blob =
    new Blob(
      [
        JSON.stringify(
          state,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;


  a.download =
    "tabletennis-backup.json";


  document.body
    .appendChild(a);


  a.click();


  a.remove();


  setTimeout(
    function(){

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );


  toast(
    "バックアップを保存しました"
  );

}


/* =========================================================
   IMPORT
========================================================= */

document
  .getElementById(
    "importFile"
  )
  .addEventListener(
    "change",
    function(event){

      const file =
        event.target.files[0];


      if(!file){

        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(){

          try{

            const imported =
              JSON.parse(
                reader.result
              );


            if(
              !imported.settings ||
              !Array.isArray(
                imported.players
              ) ||
              !Array.isArray(
                imported.matches
              )
            ){

              throw new Error(
                "invalid"
              );

            }


            state =
              imported;


            initCourts();


            saveState();


            toast(
              "バックアップを読み込みました"
            );


          }catch(e){

            toast(
              "JSONの読み込みに失敗しました"
            );

          }

        };


      reader.readAsText(
        file
      );


      event.target.value =
        "";

    }
  );


/* =========================================================
   RESET
========================================================= */

document
  .getElementById(
    "resetBtn"
  )
  .addEventListener(
    "click",
    function(){

      if(
        !confirm(
          "大会データをすべて初期化しますか？"
        )
      ){

        return;

      }


      state =
        clone(
          defaultState
        );


      initCourts();


      saveState();


      go(
        "dashboard"
      );


      toast(
        "大会データを初期化しました"
      );

    }
  );


/* =========================================================
   COURT OPTIONS
   1〜40
========================================================= */

const courtSelect =
  document.getElementById(
    "courtCount"
  );


for(
  let i=1;
  i<=40;
  i++
){

  const option =
    document.createElement(
      "option"
    );


  option.value =
    String(i);


  option.textContent =
    i + "コート";


  courtSelect.appendChild(
    option
  );

}


/* =========================================================
   GLOBAL FUNCTIONS
========================================================= */

window.openCourt =
  openCourt;

window.openResultModal =
  openResultModal;

window.finishMatch =
  finishMatch;

window.assignSpecific =
  assignSpecific;

window.resetMatch =
  resetMatch;

window.removePlayer =
  removePlayer;


/* =========================================================
   START
========================================================= */

initCourts();

renderAll();

})();

</script>
